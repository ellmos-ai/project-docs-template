<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Project Docs Template CLI Workflow Preview</title>
  <desc id="desc">Dark-mode terminal workflow showing init-project scaffolding, doc-lint validation, todo-archive journaling, and merge-safe profile upgrades.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161f2e"/>
      <stop offset="100%" stop-color="#1b2638"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, "Cascadia Mono", "Fira Code", Menlo, Monaco, monospace; font-size: 13px; }
      .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
      .prompt { fill: #38bdf8; font-weight: 700; }
      .cmd { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .ok { fill: #34d399; font-weight: 600; }
      .info { fill: #60a5fa; }
      .warn { fill: #fbbf24; }
      .accent { fill: #a78bfa; }
      .pill-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="880" height="520" rx="12" fill="url(#bgGrad)" stroke="#263244" stroke-width="1.5"/>
  <path d="M12 0.75 H868 A11.25 11.25 0 0 1 879.25 12 V42 H0.75 V12 A11.25 11.25 0 0 1 12 0.75 Z" fill="url(#barGrad)"/>
  <line x1="0" y1="42" x2="880" y2="42" stroke="#263244" stroke-width="1"/>

  <circle cx="24" cy="21" r="6" fill="#f87171"/>
  <circle cx="44" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="21" r="6" fill="#34d399"/>
  <text x="440" y="25" text-anchor="middle" class="title-txt">project-docs-template — Local-First Agent Documentation CLI (Stdlib Only)</text>

  <rect x="706" y="10" width="158" height="22" rx="11" fill="#1e293b" stroke="#334155"/>
  <text x="785" y="25" text-anchor="middle" class="pill-txt">Zero-Egress · Python 3.10+</text>

  <text x="24" y="72" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">python template/_tools/init-project --target ./my-app --name "my-app" --profile STANDARD</tspan></text>
  <text x="24" y="96" class="mono info">==&gt; Target: ./my-app  |  Profile: STANDARD  |  Manifest: .project-docs-template.json</text>
  <text x="24" y="118" class="mono"><tspan class="ok">  OK:</tspan> <tspan class="cmd">CLAUDE.md, AGENTS.md, START.md, STATE.md, TODO.md, DONE.md</tspan></text>
  <text x="24" y="138" class="mono"><tspan class="ok">  OK:</tspan> <tspan class="cmd">DECISIONS.md, PATTERNS.md, CHANGELOG.md, HEADER-RULES.md, CUT-AND-CLUE.md</tspan></text>
  <text x="24" y="158" class="mono"><tspan class="ok">  OK:</tspan> <tspan class="cmd">_tools/doc-lint, _tools/todo-archive, .gitignore (SHA-256 hashes recorded)</tspan></text>

  <line x1="24" y1="176" x2="856" y2="176" stroke="#1e293b" stroke-width="1"/>

  <text x="24" y="202" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">python ./my-app/_tools/doc-lint --root ./my-app</tspan></text>
  <text x="24" y="224" class="mono muted">Checking YAML frontmatter, placeholder markers, and freshness windows...</text>
  <text x="24" y="246" class="mono"><tspan class="ok">  PASS:</tspan> <tspan class="cmd">12/12 managed documents verified (0 unresolved placeholders, 0 stale headers)</tspan></text>

  <line x1="24" y1="264" x2="856" y2="264" stroke="#1e293b" stroke-width="1"/>

  <text x="24" y="290" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">python ./my-app/_tools/todo-archive --todo ./my-app/TODO.md --done ./my-app/DONE.md --apply</tspan></text>
  <text x="24" y="312" class="mono muted">Staging paired update + write-ahead journal for completed [x] tasks...</text>
  <text x="24" y="334" class="mono"><tspan class="ok">  ARCHIVED:</tspan> <tspan class="cmd">Completed items moved TODO.md -&gt; DONE.md (journal committed and cleared)</tspan></text>

  <line x1="24" y1="352" x2="856" y2="352" stroke="#1e293b" stroke-width="1"/>

  <text x="24" y="378" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">python template/_tools/init-project --target ./my-app --upgrade --profile FULL</tspan></text>
  <text x="24" y="400" class="mono"><tspan class="accent">  VERIFY:</tspan> <tspan class="cmd">All managed SHA-256 hashes match manifest (0 unowned collisions)</tspan></text>
  <text x="24" y="422" class="mono"><tspan class="ok">  UPGRADED:</tspan> <tspan class="cmd">STANDARD -&gt; FULL (MASTER-REGISTRY.md, WORKFLOWS.md, TOOLS.md, ARCHITECTURE.md)</tspan></text>

  <rect x="24" y="446" width="832" height="52" rx="8" fill="#131c2b" stroke="#243247"/>
  <text x="40" y="468" class="mono info">Profiles: MINIMAL (Core Context) -&gt; STANDARD (Decisions/Tasks) -&gt; FULL (Routers/Workflows)</text>
  <text x="40" y="488" class="mono muted">Fail-closed staging · Conditional hash-guarded rollback · 100% Python Standard Library</text>
</svg>
