[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-docs-template"
version = "0.1.0"
description = "Agent-ready project documentation template with START/STATE/TODO/DONE, workflows, lightweight tooling, and LLM-friendly project memory."
readme = "README.md"
authors = [
    { name = "Lukas Geiger", email = "lukas@um-bruch.org" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Build Tools",
]
keywords = ["llm", "claude-code", "antigravity", "codex", "documentation-template", "agent-handoff", "start-state-todo-done"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/project-docs-template"
Repository = "https://github.com/ellmos-ai/project-docs-template"
Issues = "https://github.com/ellmos-ai/project-docs-template/issues"
Changelog = "https://github.com/ellmos-ai/project-docs-template/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
