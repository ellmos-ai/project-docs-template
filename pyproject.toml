[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-docs-template"
version = "0.1.2"
description = "Agent-ready project documentation template with START/STATE/TODO/DONE, workflows, lightweight tooling, and LLM-friendly project memory."
readme = "README.md"
authors = [
    { name = "Lukas Geiger", email = "lukas@um-bruch.org" }
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Build Tools",
]
keywords = [
    "llm",
    "claude-code",
    "antigravity",
    "codex",
    "documentation-template",
    "agent-handoff",
    "start-state-todo-done",
    "multi-agent",
    "zero-egress",
    "governance",
    "session-handoff",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/project-docs-template"
Documentation = "https://github.com/ellmos-ai/project-docs-template#readme"
Repository = "https://github.com/ellmos-ai/project-docs-template"
Issues = "https://github.com/ellmos-ai/project-docs-template/issues"
"Bug Tracker" = "https://github.com/ellmos-ai/project-docs-template/issues"
Changelog = "https://github.com/ellmos-ai/project-docs-template/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/project-docs-template/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/project-docs-template/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/project-docs-template/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/project-docs-template/blob/main/llms.txt"
Umbrella = "https://open-bricks.org"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]


[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E722", "E741", "F841"]
